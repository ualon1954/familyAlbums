<style>

</style></head><body><header class="top"><a class="brand" href="index.html">Family <b>Album</b> ♥</a><nav id="nav"></nav><div class="actions"><button onclick="toggleTheme()">◐</button><button class="pill" onclick="logout()">יציאה</button></div></header>
<main class="section"><div class="heading"><div><span class="eyebrow">ADMIN</span><h1>📋 יומן פעילויות</h1><p>צפייה, סינון ומיון של פעולות שבוצעו במערכת.</p></div></div>
<div class="activity-shell">
<div class="activity-filter-toolbar"><strong><span class="filter-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18l-7 8v5l-4 2v-7L3 5z"/></svg></span> סינון יומן</strong><span class="activity-filter-summary" id="filterSummary">ללא סינון פעיל</span><button class="btn activity-filter-toggle activity-icon-btn" id="filterToggle" type="button" aria-expanded="false"><span class="activity-btn-icon" aria-hidden="true">⚲</span><span>הצג סינון</span><span class="toggle-arrow" aria-hidden="true">⌄</span></button></div>
<section class="panel activity-filter-panel" id="filterPanel" aria-hidden="true"><div class="activity-filter-title"><h2><span class="filter-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18l-7 8v5l-4 2v-7L3 5z"/></svg></span> סינון</h2><button class="activity-filter-close" id="filterClose" type="button" aria-label="סגור סינון" title="סגור סינון">×</button></div><div class="activity-filters">

<div class="activity-field"><label>עד תאריך ושעה</label><div class="activity-date-time"><input id="toDate" type="date" aria-label="עד תאריך"><input id="toTime" type="time" aria-label="עד שעה" step="60"></div></div>
<div class="activity-field activity-user-search"><label for="userFilter">משתמש</label><input id="userFilter" type="search" autocomplete="off" placeholder="הקלד שם משתמש..." aria-label="חיפוש משתמש לפי שם"><div id="userSearchStatus" class="activity-user-search-status" aria-live="polite"></div></div>
<div class="activity-field"><label for="actionFilter">פעולה</label><select id="actionFilter"><option value="">כל הפעולות</option></select></div>
<div class="activity-field"><label for="typeFilter">סוג</label><select id="typeFilter"><option value="">כל הסוגים</option></select></div>
</div><div class="activity-filter-actions"><button class="btn activity-filter-action-btn activity-apply-btn activity-icon-btn" id="applyFilters"><span class="activity-btn-icon" aria-hidden="true">⚲</span><span>סנן</span></button><button class="btn secondary activity-filter-action-btn activity-reset-btn activity-icon-btn" id="resetFilters"><span class="activity-btn-icon" aria-hidden="true">↺</span><span>נקה סינון</span></button><button class="btn activity-clear-btn activity-icon-btn" id="clearLog"><span class="activity-btn-icon" aria-hidden="true">🗑</span><span>ניקוי יומן</span></button></div></section>
<section class="panel activity-list-panel"><div class="activity-summary"><div class="activity-count" id="resultCount">טוען...</div><div class="activity-index-note" id="indexInfo"></div></div><div class="activity-table-wrap"><table class="activity-table"><thead><tr><th><button class="activity-sort" data-sort="createdAt">תאריך ושעה <span class="sort-arrow">↕</span></button></th><th><button class="activity-sort" data-sort="user">משתמש <span class="sort-arrow">↕</span></button></th><th><button class="activity-sort" data-sort="action">פעולה <span class="sort-arrow">↕</span></button></th><th><button class="activity-sort" data-sort="entityType">סוג <span class="sort-arrow">↕</span></button></th><th><button class="activity-sort" data-sort="details">פרטים <span class="sort-arrow">↕</span></button></th></tr></thead><tbody id="activityRows"></tbody></table></div><div class="activity-pager"><button class="btn activity-icon-btn" id="prevPage"><span class="activity-btn-icon" aria-hidden="true">›</span><span>הקודם</span></button><span id="pageInfo"></span><button class="btn activity-icon-btn" id="nextPage"><span>הבא</span><span class="activity-btn-icon" aria-hidden="true">‹</span></button></div></section></div></main>
<div id="userInfoModal" class="activity-modal" aria-hidden="true"><div class="activity-modal-card" role="dialog" aria-modal="true"><h2>פרטי משתמש</h2><p><strong id="infoUserName"></strong></p><div class="activity-email" id="infoUserEmail"></div><div class="activity-modal-actions"><button class="btn activity-icon-btn" id="closeUserInfo"><span class="activity-btn-icon" aria-hidden="true">×</span><span>סגור</span></button></div></div></div>
<div id="clearLogModal" class="activity-modal" aria-hidden="true"><div class="activity-modal-card" role="dialog" aria-modal="true"><h2>ניקוי יומן פעילויות</h2><p id="clearLogText"></p><p class="hint">המחיקה אינה ניתנת לביטול. פעולת הניקוי עצמה תירשם מחדש ביומן.</p><div class="activity-modal-actions"><button class="btn secondary activity-icon-btn" id="cancelClear"><span class="activity-btn-icon" aria-hidden="true">×</span><span>ביטול</span></button><button class="btn activity-clear-btn activity-icon-btn" id="confirmClear"><span class="activity-btn-icon" aria-hidden="true">🗑</span><span>כן, מחק</span></button></div></div></div>
<script src="js/api.js?v=R16O"></script><script src="js/layout.js?v=R16O"></script><script>
const S=requireLogin('ADMIN');let bootstrap=null,currentPage=1,lastResult=null,sortBy='createdAt',sortDir='desc',loadSeq=0,userSearchTimer=0;
if(S){mountLayout('activityLog');initActivityLog();}
const $=id=>document.getElementById(id);
function opt(value,label){const o=document.createElement('option');o.value=value;o.textContent=label;return o;}
function fillSelect(id,items,valueKey,labelKey){const el=$(id);items.forEach(x=>el.appendChild(opt(typeof x==='string'?x:x[valueKey],typeof x==='string'?x:x[labelKey])));}
async function initActivityLog(){try{const r=await API.call('activityLogBootstrap',{token:S.token});if(!r?.ok)throw Error(r?.message||'לא ניתן לטעון את היומן');bootstrap=r.data||{};fillSelect('actionFilter',bootstrap.actions||[]);fillSelect('typeFilter',bootstrap.types||[]);$('indexInfo').textContent=`אינדקסים פעילים: משתמש, פעולה, סוג ותאריך · ${bootstrap.total||0} רשומות`;await loadActivityLog();}catch(e){$('resultCount').textContent=e.message;toast(e.message,'error');}}
function dateTimeISO(dateId,timeId,isEnd=false){const d=$(dateId).value;if(!d)return '';const t=$(timeId).value||(isEnd?'23:59':'00:00');const x=new Date(`${d}T${t}`);return isNaN(x)?'':x.toISOString();}
function filters(){return {token:S.token,from:dateTimeISO('fromDate','fromTime'),to:dateTimeISO('toDate','toTime',true),userQuery:String($('userFilter').value||'').trim(),logAction:$('actionFilter').value,entityType:$('typeFilter').value,sortBy,sortDir,page:currentPage,pageSize:50};}
function formatDT(v){if(!v)return '';const d=new Date(v);return isNaN(d)?String(v):d.toLocaleString('he-IL',{dateStyle:'short',timeStyle:'short'});}
function setFilterOpen(open){const panel=$('filterPanel'),btn=$('filterToggle');panel.classList.toggle('open',!!open);panel.setAttribute('aria-hidden',open?'false':'true');btn.setAttribute('aria-expanded',open?'true':'false');btn.childNodes[0].nodeValue=open?'הסתר סינון ':'הצג סינון ';document.body.style.overflow=(open&&matchMedia('(max-width:560px)').matches)?'hidden':'';}
function updateSortUI(){
  const key=String(sortBy||'createdAt'),dir=sortDir==='asc'?'asc':'desc';
  document.querySelectorAll('.activity-table thead th').forEach(th=>{th.classList.remove('sorted');th.removeAttribute('aria-sort');});
  document.querySelectorAll('.activity-sort').forEach(b=>{b.classList.remove('active');const a=b.querySelector('.sort-arrow');if(a)a.textContent='↕';});
  document.querySelectorAll('.activity-table tbody td.sorted-col').forEach(td=>td.classList.remove('sorted-col'));
  const activeBtn=Array.from(document.querySelectorAll('.activity-sort')).find(b=>String(b.dataset.sort)===key);
  if(!activeBtn)return;
  activeBtn.classList.add('active');
  const th=activeBtn.closest('th');
  if(th){th.classList.add('sorted');th.setAttribute('aria-sort',dir==='asc'?'ascending':'descending');}
  const arrow=activeBtn.querySelector('.sort-arrow');if(arrow)arrow.textContent=dir==='asc'?'↑':'↓';
  const columnMap={createdAt:1,user:2,action:3,entityType:4,details:5};
  const col=columnMap[key];
  if(col&&matchMedia('(min-width:851px)').matches)document.querySelectorAll(`.activity-table tbody tr td:nth-child(${col})`).forEach(td=>td.classList.add('sorted-col'));
}
function updateFilterSummary(){const parts=[];if($('fromDate').value)parts.push('מתאריך');if($('toDate').value)parts.push('עד תאריך');if($('userFilter').value)parts.push('משתמש');if($('actionFilter').value)parts.push('פעולה');if($('typeFilter').value)parts.push('סוג');$('filterSummary').textContent=parts.length?`סינון פעיל: ${parts.join(' · ')}`:'ללא סינון פעיל';updateSortUI();}
function showUser(name,email){$('infoUserName').textContent=name||'משתמש';$('infoUserEmail').textContent=email||'אין כתובת אימייל';$('userInfoModal').classList.add('open');$('userInfoModal').setAttribute('aria-hidden','false');}
function closeModal(id){$(id).classList.remove('open');$(id).setAttribute('aria-hidden','true');}
async function loadActivityLog(options={}){
  const tbody=$('activityRows'),panel=document.querySelector('.activity-list-panel');
  const preserve=!!options.preserve && !!lastResult;
  const seq=++loadSeq;
  if(preserve){
    panel?.classList.add('is-refreshing');
  }else{
    tbody.innerHTML='<tr><td colspan="5" class="activity-empty">טוען...</td></tr>';
  }
  try{
    const r=await API.call('activityLogQuery',filters());
    if(seq!==loadSeq)return;
    if(!r?.ok)throw Error(r?.message||'שגיאה בטעינת היומן');
    lastResult=r.data||{items:[],total:0,page:1,pages:1};
    $('resultCount').textContent=`נמצאו ${lastResult.total} רשומות`;
    $('pageInfo').textContent=`עמוד ${lastResult.page} מתוך ${lastResult.pages}`;
    $('prevPage').disabled=lastResult.page<=1;
    $('nextPage').disabled=lastResult.page>=lastResult.pages;
    $('clearLog').disabled=!lastResult.total;
    tbody.innerHTML=(lastResult.items||[]).map(x=>`<tr><td data-label="תאריך ושעה">${esc(formatDT(x.createdAt))}</td><td data-label="משתמש"><button class="activity-user-btn" data-user-name="${esc(x.userDisplayName)}" data-user-email="${esc(x.userEmail)}" title="${esc(x.userEmail||x.userDisplayName)}">${esc(x.userDisplayName)}</button></td><td data-label="פעולה"><span class="activity-badge">${esc(x.action||'—')}</span></td><td data-label="סוג">${esc(x.entityType||'—')}</td><td data-label="פרטים" data-wide="1" class="activity-details" title="${esc(x.details||'')}">${esc(x.details||'—')}</td></tr>`).join('')||'<tr><td colspan="5" class="activity-empty">לא נמצאו פעילויות התואמות לסינון.</td></tr>';
    updateSortUI();
  }catch(e){
    if(seq!==loadSeq)return;
    if(!preserve)tbody.innerHTML=`<tr><td colspan="5" class="activity-empty">${esc(e.message)}</td></tr>`;
    toast(e.message,'error');
  }finally{
    if(seq===loadSeq)panel?.classList.remove('is-refreshing');
  }
}
$('userFilter').addEventListener('input',()=>{
  clearTimeout(userSearchTimer);
  const q=String($('userFilter').value||'').trim();
  $('userSearchStatus').textContent=q?'מחפש אוטומטית...':'';
  userSearchTimer=setTimeout(async()=>{
    currentPage=1;
    updateFilterSummary();
    await loadActivityLog({preserve:true});
    $('userSearchStatus').textContent=q?`תוצאות עבור "${q}"`:'';
  },120);
});

function bindDefaultTime(dateId,timeId,defaultTime){
  $(dateId).addEventListener('change',()=>{
    if($(dateId).value && !$(timeId).value)$(timeId).value=defaultTime;
  });
}
bindDefaultTime('fromDate','fromTime','00:00');
bindDefaultTime('toDate','toTime','23:59');
$('filterToggle').onclick=()=>setFilterOpen(!$('filterPanel').classList.contains('open'));$('filterClose').onclick=()=>setFilterOpen(false);
$('applyFilters').onclick=()=>{currentPage=1;updateFilterSummary();setFilterOpen(false);loadActivityLog();};$('resetFilters').onclick=()=>{clearTimeout(userSearchTimer);['fromDate','fromTime','toDate','toTime','userFilter','actionFilter','typeFilter'].forEach(id=>$(id).value='');$('userSearchStatus').textContent='';currentPage=1;updateFilterSummary();loadActivityLog();};$('prevPage').onclick=()=>{if(currentPage>1){currentPage--;loadActivityLog();}};$('nextPage').onclick=()=>{if(lastResult&&currentPage<lastResult.pages){currentPage++;loadActivityLog();}};
document.querySelectorAll('.activity-sort').forEach(b=>b.onclick=()=>{const key=b.dataset.sort;if(sortBy===key)sortDir=sortDir==='asc'?'desc':'asc';else{sortBy=key;sortDir='asc';}currentPage=1;updateSortUI();loadActivityLog({preserve:true});});
$('activityRows').addEventListener('click',e=>{const b=e.target.closest('.activity-user-btn');if(b)showUser(b.dataset.userName,b.dataset.userEmail);});$('closeUserInfo').onclick=()=>closeModal('userInfoModal');$('userInfoModal').onclick=e=>{if(e.target===$('userInfoModal'))closeModal('userInfoModal');};
$('clearLog').onclick=()=>{if(!lastResult?.total)return;$('clearLogText').textContent=`יימחקו ${lastResult.total} הרשומות התואמות לסינון הנוכחי.`;$('clearLogModal').classList.add('open');$('clearLogModal').setAttribute('aria-hidden','false');};$('cancelClear').onclick=()=>closeModal('clearLogModal');$('clearLogModal').onclick=e=>{if(e.target===$('clearLogModal'))closeModal('clearLogModal');};$('confirmClear').onclick=async()=>{const b=$('confirmClear');b.disabled=true;const old=b.textContent;b.textContent='מוחק...';try{const payload=filters();delete payload.page;delete payload.pageSize;delete payload.sortBy;delete payload.sortDir;const r=await API.call('clearActivityLogFiltered',payload);if(!r?.ok)throw Error(r?.message||'לא ניתן לנקות את היומן');closeModal('clearLogModal');toast(`${r.data?.deleted||0} רשומות נמחקו`,'success');currentPage=1;await initAfterClear();}catch(e){toast(e.message,'error');}finally{b.disabled=false;b.textContent=old;}};
async function initAfterClear(){const r=await API.call('activityLogBootstrap',{token:S.token});if(r?.ok){bootstrap=r.data||bootstrap;$('indexInfo').textContent=`אינדקסים פעילים: משתמש, פעולה, סוג ותאריך · ${bootstrap.total||0} רשומות`;}await loadActivityLog();}
</script></body></html>
