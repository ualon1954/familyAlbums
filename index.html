<script id="spa-legacy-nav-hard-guard">
(function(){
  window.FPA_SPA_SHELL=true;
  const map={"albums.html":"#/albums","dashboard.html":"#/dashboard","favorites.html":"#/favorites","about.html":"#/about","trash.html":"#/trash","activity-log.html":"#/activity","admin.html":"#/admin"};
  function routeFor(u){const f=(u.pathname.split('/').pop()||'').toLowerCase();if(f==='album.html')return '#/album?id='+encodeURIComponent(u.searchParams.get('id')||'');return map[f]||'';}
  function normalize(root){
    (root||document).querySelectorAll?.('a[href], [data-href]')?.forEach(el=>{
      for(const attr of ['href','data-href']){
        const raw=(el.getAttribute?.(attr)||'').trim(); if(!raw) continue;
        let u; try{u=new URL(raw,location.href);}catch(_){continue;}
        const route=routeFor(u);
        if(route) el.setAttribute(attr,route);
      }
    });
  }
  document.addEventListener('click',function(e){
    const a=e.target?.closest?.('a[href], [data-href]'); if(!a) return;
    const raw=(a.getAttribute('href')||a.getAttribute('data-href')||'').trim(); if(!raw) return;
    let u; try{u=new URL(raw,location.href);}catch(_){return;}
    const route=routeFor(u); if(!route) return;
    e.preventDefault(); e.stopImmediatePropagation(); location.hash=route;
  },true);
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',()=>normalize(document)); else normalize(document);
  new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1)normalize(n)}))).observe(document.documentElement,{childList:true,subtree:true});
})();
</script>

<script>
function shouldAutoOpenLogin(){
  const p=new URLSearchParams(location.search);
  return p.get("autoLogin")==="1" || !getSession()?.user || !getSession()?.token;
}
function hasActiveSession(){
  try{
    const sm = window.SessionManager?.getSession?.();
    if(sm && sm.user && sm.token) return true;
  }catch(e){}
  return false;
}

function resetLoginForm(){
  const form=document.getElementById("modalLoginForm");
  try{ form?.reset(); }catch(e){}
  const email=document.getElementById("modalEmail");
  const password=document.getElementById("modalPassword");
  if(email) email.value="";
  if(password){ password.value=""; password.type="password"; }
  const msg=document.getElementById("modalLoginMsg");
  if(msg){ msg.textContent=""; msg.className="login-message"; }
}
window.resetLoginForm=resetLoginForm;

function openLoginModal(){
  const modal=document.getElementById("loginModal");
  if(!modal)return;
  const locked=!hasActiveSession();
  modal.classList.add("modal-dark");
  modal.classList.add("open");
  modal.setAttribute("aria-hidden","false");
  modal.dataset.locked=locked?"true":"false";
  document.body.classList.add("modal-open");
  const close=document.getElementById("loginModalClose");
  if(close){
    close.style.display=locked?"none":"flex";
    close.disabled=locked;
    close.setAttribute("aria-hidden",locked?"true":"false");
  }
  setTimeout(()=>document.getElementById("modalEmail")?.focus(),80);
}
function updateLoginModalThemeButton(){
  const btn=document.getElementById("loginModalTheme");
  if(!btn) return;
  const modal=document.getElementById("loginModal");
  const dark=!!modal?.classList.contains("modal-dark");
  btn.textContent=dark?"☀":"☾";
  btn.setAttribute("aria-label",dark?"מעבר למצב בהיר":"מעבר למצב כהה");
  btn.title=dark?"עבור למצב בהיר":"עבור למצב כהה";
}
function toggleLoginModalTheme(){
  const modal=document.getElementById("loginModal");
  if(!modal)return;
  modal.classList.toggle("modal-dark");
  updateLoginModalThemeButton();
}
updateLoginModalThemeButton();

function closeLoginModal(){
  const modal=document.getElementById("loginModal");
  if(!modal)return;
  // When there is no active Session, the login screen is mandatory.
  if(!hasActiveSession()){
    openLoginModal();
    return;
  }
  modal.classList.remove("open");
  modal.setAttribute("aria-hidden","true");
  modal.removeAttribute("data-locked");
  document.body.classList.remove("modal-open");
}

document.getElementById("modalLoginForm")?.addEventListener("submit",async e=>{
  e.preventDefault();
  const email=document.getElementById("modalEmail").value.trim();
  const password=document.getElementById("modalPassword").value;
  const msg=document.getElementById("modalLoginMsg");
  const btn=document.getElementById("modalLoginButton");
  msg.innerHTML='<span class="login-inline-spinner" aria-hidden="true"></span><span>מתחבר...</span>';
  msg.className="login-message is-loading";
  btn.disabled=true;
  try{
    const r=await API.call("login",{email,password});
    if(!r?.ok) throw new Error(r?.message||"פרטי הכניסה אינם תקינים");
    /* SessionManager is the single source of truth. */
    try{
      if(window.SessionManager?.start) SessionManager.start(r.data.user, r.data.token, false);
    }catch(e){ console.warn("Session manager:",e); }
    msg.textContent="התחברות הצליחה";
    msg.className="login-message success";
    // R17P1A: after authentication, hand visual control to the single global bootstrap loader.
    closeLoginModal();
    // R17K6: complete the cold bootstrap while the Login Modal is still visible.
    // Dashboard therefore opens already populated, without a second loading paint.
    const session = window.SessionManager?.getSession?.() || {user:r.data.user, token:r.data.token};
    try{
      window.AppState?.setSession?.(session);
      window.AppRouter?.resetPersistent?.();
      const boot=await window.SessionDataStore.ensureApplicationBootstrap();
      if(window.mountLayout) window.mountLayout("dashboard");
    }catch(e){
      console.warn("SPA cold bootstrap:",e);
      // Keep login successful even if bootstrap fails; Dashboard retains its
      // existing server-first fallback and can recover there.
      if(window.mountLayout) window.mountLayout("dashboard");
    }
    closeLoginModal();
    window.AppRouter?.go?.("dashboard");
  }catch(err){
    msg.textContent=err?.message||"אירעה שגיאה בעת ההתחברות";
    msg.className="login-message error";
  }finally{
    btn.disabled=false;
  }
});
if(shouldAutoOpenLogin()) setTimeout(openLoginModal,120);

document.addEventListener("keydown",e=>{
  const modal=document.getElementById("loginModal");
  if(e.key==="Escape" && modal?.classList.contains("open")){
    if(!hasActiveSession()){
      e.preventDefault();
      e.stopPropagation();
      return;
    }
    closeLoginModal();
  }
});
</script>
<script id="password-toggle-eye-script">
(function(){
  function eyeOpen(){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.8"/></svg>';
  }
  function eyeClosed(){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 6.2A10.7 10.7 0 0 1 12 6c6.5 0 10 6 10 6a17.4 17.4 0 0 1-3.1 3.8"/><path d="M6.2 6.8C3.6 8.6 2 12 2 12s3.5 6 10 6c1.4 0 2.7-.3 3.9-.8"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
  }
  document.addEventListener('click', function(e){
    const btn=e.target.closest('[data-password-toggle]');
    if(!btn) return;
    const id=btn.getAttribute('data-password-toggle');
    const input=document.getElementById(id);
    if(!input) return;
    const show=input.type==='password';
    input.type=show?'text':'password';
    btn.innerHTML=show?eyeClosed():eyeOpen();
    btn.setAttribute('aria-label', show?'הסתר סיסמה':'הצג סיסמה');
    btn.setAttribute('title', show?'הסתר סיסמה':'הצג סיסמה');
  });
})();
</script>
