<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/x-icon" href="favicon.ico?v=3512"><link rel="shortcut icon" type="image/x-icon" href="favicon.ico?v=3512">

<title>לוח בקרה</title><link rel="stylesheet" href="css/main.css"><script src="js/config.js"></script><script src="js/utils.js"></script><script src="js/session-manager.js"></script><script src="js/theme.js"></script><script>
(function(){
  const s=getSession();
  if(!s || !s.user || !s.token){
    const ret=location.pathname.split('/').pop()+location.search;
    location.replace("index.html?autoLogin=1&return="+encodeURIComponent(ret));
  }
})();
</script>
<link rel="stylesheet" href="css/session-manager.css"></head><body><header class="top"><a class="brand" href="index.html">Family <b>Album</b> ♥</a><nav id="nav"></nav><div class="actions"><span id="userName"></span><button onclick="toggleTheme()">◐</button><button class="pill" onclick="logout()">יציאה</button></div></header><main class="section"><div class="heading"><div><span class="eyebrow">DASHBOARD</span><h1>שלום, <span id="hello"></span> 👋</h1><p>כאן מתחילים את המסע בזיכרונות שלכם.</p></div></div><div class="dashboard-grid">
<a class="metric metric-link" href="albums.html" aria-label="פתיחת אלבומים">
  <span>📚</span><strong id="albumCount">—</strong><small>אלבומים</small><b class="metric-action">פתח אלבומים ←</b>
</a>
<a class="metric metric-link" href="album.html?id=__ALL__" data-direct="photos" aria-label="פתיחת כל התמונות">
  <span>🖼️</span><strong id="photoCount">—</strong><small>תמונות</small><b class="metric-action">פתח תמונות ←</b>
</a>
<a class="metric metric-link" href="favorites.html" aria-label="פתיחת מועדפים">
  <span>♥</span><strong id="favCount">—</strong><small>מועדפים</small><b class="metric-action">פתח מועדפים ←</b>
</a>
<a class="metric metric-link" href="trash.html" id="trashCard" aria-label="פתיחת סל המחזור" style="display:none">
  <span>🗑️</span><strong>♻</strong><small>סל מחזור</small><b class="metric-action">פתח סל מחזור ←</b>
</a>
<a class="metric metric-link" href="admin.html" id="adminCard" aria-label="פתיחת מרכז הניהול" style="display:none">
  <span>⚙️</span><strong>ADMIN</strong><small>ניהול</small><b class="metric-action">פתח ניהול ←</b>
</a>
</div>

</main><script src="js/api.js"></script><script src="js/layout.js"></script>
<script>
(function(){
  const s = getSession();

  // If there is no logged-in user, show the login screen automatically.
  if (!s || !s.user || !s.token) {
    location.replace("login.html?auto=1&return=dashboard.html");
    return;
  }

  mountLayout("dashboard");
  // Direct dashboard navigation: albums, all photos, and favorites.
  document.querySelectorAll("[data-direct]").forEach(el=>{
    el.addEventListener("click",()=>{
      const target=el.getAttribute("href");
      if(target) window.location.assign(target);
    });
  });
  const name = s.user.name || s.user.email || "משתמש";
  document.getElementById("hello").textContent = name;
  document.getElementById("userName").textContent = name;

  // Admin-only dashboard shortcuts. Trash and Administration are intentionally
  // shown only to ADMIN users, matching the permissions used by layout.js.
  const isAdmin = String(s.user.role || "").toUpperCase() === "ADMIN";
  if (isAdmin) {
    ["trashCard", "adminCard", "trashAction", "adminAction"].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.style.display = "flex";
    });
  }

  function renderDashboardData(data){
    document.getElementById("albumCount").textContent = Number(data?.albums ?? 0) || 0;
    document.getElementById("photoCount").textContent = Number(data?.photos ?? 0) || 0;
    document.getElementById("favCount").textContent = Number(data?.favorites ?? 0) || 0;
  }
  (async function(){
    try {
      // R6: render a recent session cache immediately, then refresh in the background.
      const cached=API.cacheGet("dashboard","main",60000);
      if(cached)renderDashboardData(cached);
      const r = await API.call("dashboard",{token:s.token});
      if(r && r.ok){API.cacheSet("dashboard","main",r.data);renderDashboardData(r.data);}
    } catch(e) {
      console.error("dashboard:", e);
    }
  })();
})();
</script></body></html>
