</style></head><body><header class="top"><a class="brand" href="index.html">Family <b>אלבומים</b> ♥</a><nav id="nav"></nav><div class="actions"><button type="button" onclick="toggleTheme()">◐</button></div></header><main class="section"><div class="heading"><div><span class="eyebrow">אלבום</span><h1 id="title">טוען...</h1><p id="description"></p></div><button id="start" class="btn" type="button">◀ מצגת</button></div><button id="toggleSearch" class="mobile-search-toggle" type="button" aria-expanded="false" aria-controls="photoTools" aria-label="הצג סינון"><svg class="filter-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/><circle cx="8" cy="6" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="12" cy="18" r="1.6"/></svg><span>הצג סינון</span></button><div id="photoTools" class="photo-tools mobile-search-hidden"><input id="searchTitle" type="search" placeholder="🔎 חיפוש לפי כותרת..." aria-label="חיפוש לפי כותרת"><input id="searchAlbum" type="search" placeholder="📁 חיפוש לפי שם אלבום..." aria-label="חיפוש לפי שם אלבום"><input id="searchYear" type="number" min="1800" max="2200" placeholder="משנה" aria-label="חיפוש משנה"><input id="searchYearTo" type="number" min="1800" max="2200" placeholder="עד שנה" aria-label="חיפוש עד שנה"><select id="sortYear" aria-label="מיון לפי שנה"><option value="newest">חדשים ← ישנים</option><option value="oldest">ישנים ← חדשים</option></select><button id="clearFilters" class="pill" type="button">נקה</button><span id="photoCount" class="hint"></span></div><div id="gallery" class="gallery"></div></main><div id="viewer" class="viewer" aria-hidden="true"><button id="r" type="button" aria-label="הקודם"><svg class="viewer-arrow-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button><img id="big" alt=""><button id="l" type="button" aria-label="הבא"><svg class="viewer-arrow-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><div id="caption"></div><div id 'use strict';
mountLayout('albums');
const params=new URLSearchParams(location.search);
const id=String(params.get('id')||'').trim();
let session=getSession();
let photos=[],filteredPhotos=[],i=0,slideTimer=null,renderLimit=60;
const RENDER_STEP=60;
const titleEl=document.getElementById('title'),descriptionEl=document.getElementById('description'),gallery=document.getElementById('gallery'),viewer=document.getElementById('viewer'),big=document.getElementById('big'),caption=document.getElementById('caption'),viewerDots=document.getElementById('viewerDots'),searchTitle=document.getElementById('searchTitle'),searchAlbum=document.getElementById('searchAlbum'),searchYear=document.getElementById('searchYear'),searchYearTo=document.getElementById('searchYearTo'),sortYear=document.getElementById('sortYear'),photoCount=document.getElementById('photoCount');
function photoYear(v){const m=String(v||'').match(/(?:^|[^0-9])((?:19|20|21)[0-9]{2})(?:[^0-9]|$)/);return m?m[1]:'';}
function photoTitle(p){return String(p?.photoTitle||p?.caption||p?.fileName||'ללא כותרת').trim();}
function albumTitle(p){return String(p?.albumTitle||'').trim();}
function photoCaption(p){const a=albumTitle(p),y=photoYear(p?.photoDate);return `${a||'ללא אלבום'}${y?' • '+y:''}`;}
async function init(){
  session=getSession();

  if(!id){titleEl.textContent='אלבום לא נמצא';descriptionEl.textContent='קישור האלבום אינו תקין.';gallery.innerHTML='<p>לא נבחר אלבום. חזור לרשימת האלבומים ונסה שוב.</p>';return;}
  gallery.innerHTML='<p>טוען תמונות...</p>';
  try{
    const token=session.token;
    const cacheKey='albumView:'+id;
    // R6: a short session cache makes returning to an album nearly immediate.
    const cached=API.cacheGet('albumView',id,60000);
    if(cached){
      const album=cached.album||{};

    API.cacheSet('albumView',id,r.data);
    const album=r.data?.album||{};
    titleEl.textContent=album.title||'אלבום';descriptionEl.textContent=album.description||'';
    photos=Array.isArray(r.data?.photos)?r.data.photos:[];renderLimit=RENDER_STEP;
    applyFilters();
  }catch(e){console.error(e);gallery.innerHTML=`<div class="load-error"><strong>לא ניתן לטעון את התמונות</strong><p>${esc(e?.message||'שגיאה לא ידועה')}</p><button class="pill" type="button" onclick="init()">↻ נסה שוב</button></div>`;photoCount.textContent='';}
}
function applyFilters(){
  const q=searchTitle.value.trim().toLowerCase(),a=searchAlbum.value.trim().toLowerCase(),yFrom=searchYear.value.trim(),yTo=searchYearTo.value.trim();

  const fromComplete=/^\d{4}$/.test(yFrom);
  const toComplete=/^\d{4}$/.test(yTo);
  if(fromComplete && toComplete && Number(yTo) < Number(yFrom)){
    alert('עד שנה לא יכול להיות קטן ממשנה');
    searchYearTo.focus();
    filteredPhotos=[];
    renderPhotos();
    return;
  }

  filteredPhotos=photos.filter(p=>{
    const py=Number(photoYear(p.photoDate))||0;
    const fromOk=!yFrom||py>=Number(yFrom);
    const toOk=!yTo||py<=Number(yTo);
    return (!q||photoTitle(p).toLowerCase().includes(q))&&(!a||albumTitle(p).toLowerCase().includes(a))&&fromOk&&toOk;
  });
  filteredPhotos.sort((a,b)=>{const ya=Number(photoYear(a.photoDate))||0,yb=Number(photoYear(b.photoDate))||0;return sortYear.value==='oldest'?ya-yb:yb-ya;});
  renderLimit=RENDER_STEP;
  renderGallery();
}
function renderGallery(){
  const visible=filteredPhotos.slice(0,renderLimit);
  photoCount.textContent=`${filteredPhotos.length} מתוך ${photos.length} תמונות`;
  const cards=visible.map((p,n)=>{
    const title=esc(photoTitle(p)),cap=photoCaption(p),url=esc(p.thumbnailUrl||p.imageUrl||'');
    return `<figure class="photo-card"><div class="photo-wrap"><img src="${url}" loading="lazy" decoding="async" fetchpriority="low" referrerpolicy="no-referrer" alt="${title}" onerror="this.closest('figure').classList.add('img-error');this.alt='לא ניתן להציג את התמונה';" onclick="openPhoto(${n})"><button class="favorite-btn ${p.isFavorite?'active':''}" type="button" aria-label="${p.isFavorite?'הסר ממועדפים':'הוסף למועדפים'}" onclick="event.preventDefault();event.stopPropagation();toggleFav(${n},this)">${p.isFavorite?'♥':'♡'}</button>${p.canDelete?`<div class="photo-admin-actions"><button class="edit-photo-btn" type="button" aria-label="עריכת תמונה" title="עריכת תמונה" onclick="event.preventDefault();event.stopPropagation();openPhotoEdit(${n})">✎</button><button class="delete-photo-btn" type="button" aria-label="מחיקת תמונה" title="מחיקת תמונה" onclick="event.preventDefault();event.stopPropagation();deletePhoto(${n})">🗑️</button></div>`:''}</div><figcaption><strong>${title}</strong>${cap?`<small>📁 ${esc(cap)}</small>`:''}</figcaption></figure>`;
  }).join('');
  const more=renderLimit<filteredPhotos.length?`<div class="gallery-more"><button id="loadMorePhotos" class="pill" type="button">טען עוד ${Math.min(RENDER_STEP,filteredPhotos.length-renderLimit)} תמונות</button></div>`:'';
  gallery.innerHTML=cards+more||'<p>לא נמצאו תמונות התואמות לחיפוש.</p>';
  const moreBtn=document.getElementById('loadMorePhotos');if(moreBtn)moreBtn.onclick=()=>{renderLimit+=RENDER_STEP;renderGallery();};
}
function renderViewerDots(){if(!viewerDots)return;viewerDots.innerHTML=filteredPhotos.map((_,n)=>`<button class="viewer-dot ${n===i?'active':''}" type="button" aria-label="תמונה ${n+1} מתוך ${filteredPhotos.length}" aria-current="${n===i?'true':'false'}" onclick="openPhoto(${n})"></button>`).join('');const active=viewerDots.querySelector('.viewer-dot.active');if(active)active.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});}
function openPhoto(n){if(!filteredPhotos.length)return;i=n;const p=filteredPhotos[i];big.src=p.imageUrl||'';big.alt=photoTitle(p);caption.innerHTML=`<strong>${esc(photoTitle(p))}</strong><small>📁 ${esc(photoCaption(p))}</small>`;viewer.classList.add('open');viewer.setAttribute('aria-hidden','false');document.body.classList.add('viewer-open');const closeBtn=document.getElementById('viewerClose');if(closeBtn){closeBtn.hidden=false;closeBtn.classList.add('is-visible');}renderViewerDots();}
async function toggleFav(n,btn){
  const p=filteredPhotos[n],s=getSession();
  if(!s){location.replace('index.html?autoLogin=1&loginRequired=1');return;}
  if(btn?.dataset.pending==='1')return;
  const previous=!!p.isFavorite, optimistic=!previous;
  // R6A: optimistic favorite UI. The heart changes immediately while Apps Script saves in the background.
  p.isFavorite=optimistic;
  const original=photos.find(x=>String(x.id)===String(p.id));
  if(original)original.isFavorite=optimistic;
  if(btn){
    btn.dataset.pending='1';
    btn.classList.toggle('active',optimistic);
    btn.textContent=optimistic?'♥':'♡';
    btn.setAttribute('aria-label',optimistic?'הסר ממועדפים':'הוסף למועדפים');
  }
  try{
    const r=await API.call('toggleFavorite',{token:s.token,photoId:p.id});
    if(!r.ok)throw new Error(r.message||'שגיאה');
    const saved=!!r.data?.favorite;
    p.isFavorite=saved;
    if(original)original.isFavorite=saved;
    // Invalidate cached counters/views only after the server confirms the write.
    API.cacheRemove('albumView',id);
    API.cacheRemove('dashboard','main');
    if(btn){
      btn.classList.toggle('active',saved);
      btn.textContent=saved?'♥':'♡';
      btn.setAttribute('aria-label',saved?'הסר ממועדפים':'הוסף למועדפים');
    }
  }catch(e){
    // Roll back the optimistic state if the server could not save it.
    p.isFavorite=previous;
    if(original)original.isFavorite=previous;

      btn.classList.toggle('active',previous);
      btn.textContent=previous?'♥':'♡';
      btn.setAttribute('aria-label',previous?'הסר ממועדפים':'הוסף למועדפים');
    }
    toast(e.message||'לא ניתן לעדכן מועדפים','error');
  }finally{
    if(btn)delete btn.dataset.pending;
  }
}
let editPhotoIndex=-1;
const photoEditModal=document.getElementById('photoEditModal');
const editPhotoTitle=document.getElementById('editPhotoTitle');
const editPhotoYear=document.getElementById('editPhotoYear');
const editPhotoAlbum=document.getElementById('editPhotoAlbum');
const editAlbumOptionsCache=new Map();

async function loadPhotoEditAlbums_(p){
  const sourceAlbumId=String(p?.albumId||id||'').trim();
  editPhotoAlbum.disabled=true;
  editPhotoAlbum.innerHTML='<option value="">טוען אלבומים...</option>';
  try{
    let items=editAlbumOptionsCache.get(sourceAlbumId);
    if(!items){
      const s=getSession();if(!s)throw new Error('Session not found');
      const r=await API.call('photoEditAlbums',{token:s.token,sourceAlbumId});
      if(!r.ok)throw new Error(r.message||'לא ניתן לטעון את האלבומים');
      items=Array.isArray(r.data)?r.data:[];
      editAlbumOptionsCache.set(sourceAlbumId,items);
    }
    const currentExists=items.some(x=>String(x.id)===sourceAlbumId);
    if(!currentExists&&sourceAlbumId){
      items=[{id:sourceAlbumId,title:albumTitle(p)||titleEl.textContent||'אלבום נוכחי'},...items];
    }
    editPhotoAlbum.innerHTML=items.map(x=>`<option value="${esc(x.id)}">${esc(x.title||'ללא שם')}</option>`).join('');
    editPhotoAlbum.value=sourceAlbumId;
    editPhotoAlbum.disabled=false;
  }catch(e){
    editPhotoAlbum.innerHTML=`<option value="${esc(sourceAlbumId)}">${esc(albumTitle(p)||titleEl.textContent||'אלבום נוכחי')}</option>`;
    editPhotoAlbum.value=sourceAlbumId;
    editPhotoAlbum.disabled=false;
    toast(e.message||'לא ניתן לטעון את רשימת האלבומים','error');

}

async function openPhotoEdit(n){
  const p=filteredPhotos[n];
  if(!p?.canDelete)return;
  editPhotoIndex=n;
  editPhotoTitle.value=photoTitle(p);
  editPhotoYear.value=String(p.photoDate||'').match(/\d{4}/)?.[0]||'';
  photoEditModal.classList.add('open');
  photoEditModal.setAttribute('aria-hidden','false');
  await loadPhotoEditAlbums_(p);
  setTimeout(()=>editPhotoTitle.focus(),0);
}
function closePhotoEdit(){
  photoEditModal.classList.remove('open');
  photoEditModal.setAttribute('aria-hidden','true');
  editPhotoIndex=-1;
}
async function savePhotoEdit(){
  const p=filteredPhotos[editPhotoIndex];
  if(!p?.canDelete)return closePhotoEdit();
  const title=String(editPhotoTitle.value||'').trim();
  const year=String(editPhotoYear.value||'').trim();
  const targetAlbumId=String(editPhotoAlbum.value||'').trim();
  if(!title){toast('נא להזין כותרת לתמונה','error');editPhotoTitle.focus();return;}
  if(!/^\d{4}$/.test(year)||Number(year)<1800||Number(year)>2200){toast('נא להזין שנה תקינה','error');editPhotoYear.focus();return;}
  if(!targetAlbumId){toast('נא לבחור אלבום','error');editPhotoAlbum.focus();return;}
  const s=getSession();if(!s)return;
  const sourceAlbumId=String(p.albumId||'');
  const targetAlbumTitle=String(editPhotoAlbum.options[editPhotoAlbum.selectedIndex]?.text||'').trim();
  const moved=targetAlbumId!==sourceAlbumId;
  const saveBtn=document.getElementById('savePhotoEdit');
  saveBtn.disabled=true;
  try{
    const r=await API.call('updatePhoto',{token:s.token,id:p.id,photoTitle:title,photoDate:year,albumId:targetAlbumId});
    if(!r.ok)throw new Error(r.message||'שגיאה');

    if(moved && id!=='__ALL__'){
      photos=photos.filter(x=>String(x.id)!==String(p.id));
      filteredPhotos=filteredPhotos.filter(x=>String(x.id)!==String(p.id));
    }else{
      const apply=x=>{
        if(String(x.id)===String(p.id)){
          x.photoTitle=title;x.photoDate=year;x.albumId=targetAlbumId;
          if(targetAlbumTitle)x.albumTitle=targetAlbumTitle;
        }
      };
      photos.forEach(apply);filteredPhotos.forEach(apply);
    }

    API.cacheRemove('albumView',sourceAlbumId);
    API.cacheRemove('albumView',targetAlbumId);
    API.cacheRemove('albumView',id);
    API.cacheRemove('dashboard','main');
    API.cacheRemove('favorites','list');
    API.cacheRemove('albums','list');

    closePhotoEdit();
    if(moved && id!=='__ALL__')applyFilters();else renderGallery();
    toast(moved?'התמונה עודכנה והועברה לאלבום שנבחר':'פרטי התמונה עודכנו','success');
  }catch(e){toast(e.message||'לא ניתן לעדכן את התמונה','error');}
  finally{saveBtn.disabled=false;}
}
document.getElementById('cancelPhotoEdit').onclick=closePhotoEdit;
document.getElementById('savePhotoEdit').onclick=savePhotoEdit;
photoEditModal.addEventListener('click',e=>{if(e.target===photoEditModal)closePhotoEdit();});
async function deletePhoto(n){const p=filteredPhotos[n];if(!p?.canDelete)return;if(!confirm('למחוק את התמונה? התמונה תוסר מהאלבום וגם מהמועדפים.'))return;const s=getSession();if(!s)return;try{const r=await API.call('deletePhoto',{token:s.token,id:p.id});if(!r.ok)throw new Error(r.message||'שגיאה');API.cacheRemove('albumView',id);API.cacheRemove('dashboard','main');API.cacheRemove('albums','list');photos=photos.filter(x=>String(x.id)!==String(p.id));filteredPhotos=filteredPhotos.filter(x=>String(x.id)!==String(p.id));renderGallery();toast('התמונה נמחקה','info');}catch(e){toast(e.message||'לא ניתן למחוק את התמונה','error');}}
function move(n){if(!filteredPhotos.length)return;i=(i+n+filteredPhotos.length)%filteredPhotos.length;openPhoto(i);}
function closeViewer(){viewer.classList.remove('open');viewer.setAttribute('aria-hidden','true');document.body.classList.remove('viewer-open');const closeBtn=document.getElementById('viewerClose');if(closeBtn){closeBtn.classList.remove('is-visible');closeBtn.hidden=true;}if(viewerDots)viewerDots.innerHTML='';if(slideTimer){clearInterval(slideTimer);slideTimer=null;}}
const toggleSearch=document.getElementById('toggleSearch'),photoTools=document.getElementById('photoTools');
function filterToggleMarkup(visible){return '<svg class="filter-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/><circle cx="8" cy="6" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="12" cy="18" r="1.6"/></svg><span>'+(visible?'הסתר סינון':'הצג סינון')+'</span>';}
function setSearchVisible(visible){photoTools.classList.toggle('mobile-search-hidden',!visible);toggleSearch.setAttribute('aria-expanded',String(visible));toggleSearch.setAttribute('aria-label',visible?'הסתר סינון':'הצג סינון');toggleSearch.innerHTML=filterToggleMarkup(visible);} 
toggleSearch.onclick=()=>setSearchVisible(photoTools.classList.contains('mobile-search-hidden'));
document.getElementById('viewerClose').onclick=closeViewer;document.getElementById('r').onclick=()=>move(-1);document.getElementById('l').onclick=()=>move(1);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&photoEditModal?.classList.contains('open')){closePhotoEdit();return;}if(!viewer.classList.contains('open'))return;if(e.key==='Escape')closeViewer();else if(e.key==='ArrowRight')move(-1);else if(e.key==='ArrowLeft')move(1);});
let viewerTouchX=null;viewer.addEventListener('touchstart',e=>{viewerTouchX=e.changedTouches?.[0]?.clientX??null;},{passive:true});viewer.addEventListener('touchend',e=>{if(viewerTouchX===null)return;const x=e.changedTouches?.[0]?.clientX??viewerTouchX,dx=x-viewerTouchX;viewerTouchX=null;if(Math.abs(dx)>45)move(dx<0?1:-1);},{passive:true});
document.getElementById('start').onclick=()=>{if(!filteredPhotos.length)return;openPhoto(0);if(slideTimer)clearInterval(slideTimer);slideTimer=setInterval(()=>{if(!viewer.classList.contains('open')){clearInterval(slideTimer);slideTimer=null;}else move(1);},2800);};
[searchTitle,searchAlbum,searchYear,searchYearTo].forEach(el=>el.addEventListener('input',applyFilters));sortYear.addEventListener('change',applyFilters);document.getElementById('clearFilters').onclick=()=>{searchTitle.value='';searchAlbum.value='';searchYear.value='';searchYearTo.value='';sortYear.value='newest';applyFilters();};
init();
