<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/x-icon" href="favicon.ico?v=3512"><link rel="shortcut icon" type="image/x-icon" href="favicon.ico?v=3512"><title>אלבום</title><link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/session-manager.css"><script src="js/config.js"></script><script src="js/utils.js"></script><script src="js/session-manager.js"></script><script src="js/theme.js"></script><script>
(function(){
  const s=getSession();
  if(!s || !s.user || !s.token){
    const ret=(location.pathname.split('/').pop()||'album.html')+location.search;
    location.replace('index.html?autoLogin=1&loginRequired=1&return='+encodeURIComponent(ret));
  }
})();
</script><style>
.mobile-search-toggle{display:none;align-items:center;justify-content:center;gap:9px;border:1px solid rgba(42,39,36,.16);background:rgba(255,255,255,.82);color:#2a2724;border-radius:12px;padding:10px 15px;font-weight:800;cursor:pointer;margin:0 0 12px;box-shadow:0 5px 18px rgba(42,39,36,.06);transition:background .18s ease,border-color .18s ease,transform .18s ease}
.mobile-search-toggle:hover{background:#fff;border-color:rgba(161,110,72,.38)}
.mobile-search-toggle:active{transform:scale(.99)}
.mobile-search-toggle .filter-icon{width:19px;height:19px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dark .mobile-search-toggle{background:#24211f;color:#f3eee9;border-color:rgba(255,255,255,.14);box-shadow:0 5px 18px rgba(0,0,0,.18)}
.dark .mobile-search-toggle:hover{background:#302b28;border-color:rgba(210,154,109,.42)}
.dark .photo-tools{background:#24211f;border-color:rgba(255,255,255,.12);box-shadow:0 8px 24px rgba(0,0,0,.14)}

/* Viewer follows the active light/dark theme. */
.viewer{background:rgba(246,243,239,.96);backdrop-filter:blur(14px)}
.viewer img{box-shadow:0 18px 55px rgba(42,39,36,.22);background:#fff}
.viewer>button:not(.viewer-dot){background:rgba(42,39,36,.08);color:#2a2724;border:1px solid rgba(42,39,36,.12);backdrop-filter:blur(8px)}
.viewer>button:not(.viewer-dot):hover{background:rgba(42,39,36,.16)}
.viewer #caption{bottom:64px;text-align:center;max-width:min(82vw,900px);color:#2a2724;text-shadow:none}
.viewer #caption small{display:block;margin-top:5px;color:#6f6862}
.dark .viewer{background:rgba(0,0,0,.93)}
.dark .viewer img{box-shadow:0 18px 60px rgba(0,0,0,.55);background:#171514}
.dark .viewer>button:not(.viewer-dot){background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.12)}
.dark .viewer>button:not(.viewer-dot):hover{background:rgba(255,255,255,.22)}
.dark .viewer #caption{color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.55)}
.dark .viewer #caption small{color:#ddd}

.viewer-dots{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;justify-content:flex-start;gap:8px;max-width:min(76vw,760px);padding:9px 12px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;z-index:4;border-radius:999px;background:rgba(255,255,255,.62);border:1px solid rgba(42,39,36,.10);box-shadow:0 8px 30px rgba(42,39,36,.12);backdrop-filter:blur(12px)}
.dark .viewer-dots{background:rgba(20,20,20,.48);border-color:rgba(255,255,255,.12);box-shadow:0 8px 30px rgba(0,0,0,.28)}
.viewer-dots::-webkit-scrollbar{display:none}
/* Higher specificity is intentional: it prevents the generic .viewer button rule from turning dots into 55px square controls. */
.viewer .viewer-dot{position:relative;inset:auto;flex:0 0 auto;width:9px;height:9px;min-width:9px;min-height:9px;padding:0;margin:0;border:0;border-radius:50%;background:rgba(42,39,36,.32);box-shadow:none;transform:none;transition:width .2s ease,background .2s ease,transform .2s ease;cursor:pointer}
.viewer .viewer-dot:hover{background:rgba(42,39,36,.60);transform:scale(1.18)}
.viewer .viewer-dot.active{width:28px;min-width:28px;border-radius:999px;background:#a16e48;transform:none}
.dark .viewer .viewer-dot{background:rgba(255,255,255,.40)}
.dark .viewer .viewer-dot:hover{background:rgba(255,255,255,.78)}
.dark .viewer .viewer-dot.active{background:#fff}
@media(max-width:600px){.viewer-dots{max-width:72vw;gap:7px;padding:8px 10px}.viewer .viewer-dot{width:8px;height:8px;min-width:8px;min-height:8px}.viewer .viewer-dot.active{width:22px;min-width:22px}.viewer #caption{bottom:62px}.viewer>button:not(.viewer-dot){width:46px;height:46px;font-size:32px}}
@media(max-width:600px){
  .mobile-search-toggle{display:block;width:100%}
  .photo-tools.mobile-search-hidden{display:none}
}

/* Phone viewer: preserve maximum image area and keep controls reachable. */
@media(max-width:700px){
  .viewer{padding:62px 8px 92px}
  .viewer img{max-width:96vw;max-height:calc(100dvh - 170px);border-radius:10px;object-fit:contain}
  .viewer #x{top:10px;right:10px}
  .viewer #r{right:8px}
  .viewer #l{left:8px}
  .viewer>button:not(.viewer-dot){width:42px;height:42px;font-size:29px;background:rgba(246,243,239,.78)}
  .dark .viewer>button:not(.viewer-dot){background:rgba(25,23,22,.72)}
  .viewer #caption{bottom:52px;max-width:90vw;font-size:13px;line-height:1.3;padding:5px 10px;border-radius:10px;background:rgba(246,243,239,.72);backdrop-filter:blur(8px)}
  .dark .viewer #caption{background:rgba(20,20,20,.60)}
  .viewer-dots{bottom:10px;max-width:82vw;gap:6px;padding:7px 9px}
}
@media(max-width:420px){
  .viewer #r,.viewer #l{top:auto;bottom:57px}
  .viewer #r{right:12px}.viewer #l{left:12px}
  .viewer #caption{bottom:58px;max-width:70vw}
  .viewer-dots{max-width:88vw}
}

/* Viewer control direction and mobile close-button hardening. */
.viewer #r,.viewer #l{direction:ltr;display:grid;place-items:center;transform:none!important}
.viewer-arrow-icon{width:27px;height:27px;display:block;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transform:none!important}
.viewer #x{z-index:12;display:grid!important;place-items:center;visibility:visible!important;opacity:1!important;line-height:1;font-family:Arial,sans-serif;font-weight:400}
@media(max-width:700px){
  .viewer #x{position:absolute!important;top:max(10px,env(safe-area-inset-top))!important;right:max(10px,env(safe-area-inset-right))!important;left:auto!important;bottom:auto!important;width:44px!important;height:44px!important;min-width:44px!important;min-height:44px!important;font-size:34px!important;border-radius:50%!important;z-index:20!important}
  .viewer-arrow-icon{width:24px;height:24px}
}
</style></head><body><header class="top"><a class="brand" href="index.html">Family <b>Albums</b> ♥</a><nav id="nav"></nav><div class="actions"><button type="button" onclick="toggleTheme()">◐</button></div></header><main class="section"><div class="heading"><div><span class="eyebrow">ALBUM</span><h1 id="title">טוען...</h1><p id="description"></p></div><button id="start" class="btn" type="button">▶ מצגת</button></div><button id="toggleSearch" class="mobile-search-toggle" type="button" aria-expanded="false" aria-controls="photoTools" aria-label="הצג סינון"><svg class="filter-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/><circle cx="8" cy="6" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="12" cy="18" r="1.6"/></svg><span>הצג סינון</span></button><div id="photoTools" class="photo-tools mobile-search-hidden"><input id="searchTitle" type="search" placeholder="🔎 חיפוש לפי כותרת..." aria-label="חיפוש לפי כותרת"><input id="searchAlbum" type="search" placeholder="📁 חיפוש לפי שם אלבום..." aria-label="חיפוש לפי שם אלבום"><input id="searchYear" type="number" min="1800" max="2200" placeholder="שנה" aria-label="חיפוש לפי שנה"><select id="sortYear" aria-label="מיון לפי שנה"><option value="newest">חדשים → ישנים</option><option value="oldest">ישנים → חדשים</option></select><button id="clearFilters" class="pill" type="button">נקה</button><span id="photoCount" class="hint"></span></div><div id="gallery" class="gallery"></div></main><div id="viewer" class="viewer" aria-hidden="true"><button id="x" type="button" aria-label="סגור">×</button><button id="r" type="button" aria-label="הבא"><svg class="viewer-arrow-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button><img id="big" alt=""><button id="l" type="button" aria-label="הקודם"><svg class="viewer-arrow-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><div id="caption"></div><div id="viewerDots" class="viewer-dots" aria-label="ניווט בין התמונות"></div></div><script src="js/api.js"></script><script src="js/layout.js"></script><script>
'use strict';
mountLayout('albums');
const params=new URLSearchParams(location.search);
const id=String(params.get('id')||'').trim();
let session=getSession();
let photos=[],filteredPhotos=[],i=0,slideTimer=null;
const titleEl=document.getElementById('title'),descriptionEl=document.getElementById('description'),gallery=document.getElementById('gallery'),viewer=document.getElementById('viewer'),big=document.getElementById('big'),caption=document.getElementById('caption'),viewerDots=document.getElementById('viewerDots'),searchTitle=document.getElementById('searchTitle'),searchAlbum=document.getElementById('searchAlbum'),searchYear=document.getElementById('searchYear'),sortYear=document.getElementById('sortYear'),photoCount=document.getElementById('photoCount');
function photoYear(v){const m=String(v||'').match(/(?:^|[^0-9])((?:19|20|21)[0-9]{2})(?:[^0-9]|$)/);return m?m[1]:'';}
function photoTitle(p){return String(p?.photoTitle||p?.caption||p?.fileName||'ללא כותרת').trim();}
function albumTitle(p){return String(p?.albumTitle||'').trim();}
function photoCaption(p){const a=albumTitle(p),y=photoYear(p?.photoDate);return `${a||'ללא אלבום'}${y?' • '+y:''}`;}
async function init(){
  session=getSession();
  if(!session){return;}
  if(!id){titleEl.textContent='אלבום לא נמצא';descriptionEl.textContent='קישור האלבום אינו תקין.';gallery.innerHTML='<p>לא נבחר אלבום. חזור לרשימת האלבומים ונסה שוב.</p>';return;}
  gallery.innerHTML='<p>טוען תמונות...</p>';
  try{
    const token=session.token;
    const ar=await API.call('album',{id,token},'POST');
    if(!ar.ok)throw new Error(ar.message||'לא ניתן לטעון את האלבום');
    const album=ar.data||{};
    titleEl.textContent=album.title||'אלבום';descriptionEl.textContent=album.description||'';
    const r=await API.call('photos',{albumId:id,token},'POST');
    if(!r.ok)throw new Error(r.message||'לא ניתן לטעון את התמונות');
    photos=Array.isArray(r.data)?r.data:[];
    applyFilters();
  }catch(e){console.error(e);gallery.innerHTML=`<div class="load-error"><strong>לא ניתן לטעון את התמונות</strong><p>${esc(e?.message||'שגיאה לא ידועה')}</p><button class="pill" type="button" onclick="init()">↻ נסה שוב</button></div>`;photoCount.textContent='';}
}
function applyFilters(){
  const q=searchTitle.value.trim().toLowerCase(),a=searchAlbum.value.trim().toLowerCase(),y=searchYear.value.trim();
  filteredPhotos=photos.filter(p=>(!q||photoTitle(p).toLowerCase().includes(q))&&(!a||albumTitle(p).toLowerCase().includes(a))&&(!y||photoYear(p.photoDate)===y));
  filteredPhotos.sort((a,b)=>{const ya=Number(photoYear(a.photoDate))||0,yb=Number(photoYear(b.photoDate))||0;return sortYear.value==='oldest'?ya-yb:yb-ya;});
  renderGallery();
}
function renderGallery(){
  photoCount.textContent=`${filteredPhotos.length} מתוך ${photos.length} תמונות`;
  gallery.innerHTML=filteredPhotos.map((p,n)=>{
    const title=esc(photoTitle(p)),cap=photoCaption(p),url=esc(p.imageUrl||'');
    return `<figure class="photo-card"><div class="photo-wrap"><img src="${url}" loading="lazy" referrerpolicy="no-referrer" alt="${title}" onerror="this.closest('figure').classList.add('img-error');this.alt='לא ניתן להציג את התמונה';" onclick="openPhoto(${n})"><button class="favorite-btn ${p.isFavorite?'active':''}" type="button" aria-label="${p.isFavorite?'הסר ממועדפים':'הוסף למועדפים'}" onclick="event.preventDefault();event.stopPropagation();toggleFav(${n})">${p.isFavorite?'♥':'♡'}</button>${p.canDelete?`<button class="delete-photo-btn" type="button" aria-label="מחיקת תמונה" onclick="event.preventDefault();event.stopPropagation();deletePhoto(${n})">🗑️</button>`:''}</div><figcaption><strong>${title}</strong>${cap?`<small>📁 ${esc(cap)}</small>`:''}</figcaption></figure>`;
  }).join('')||'<p>לא נמצאו תמונות התואמות לחיפוש.</p>';
}
function renderViewerDots(){if(!viewerDots)return;viewerDots.innerHTML=filteredPhotos.map((_,n)=>`<button class="viewer-dot ${n===i?'active':''}" type="button" aria-label="תמונה ${n+1} מתוך ${filteredPhotos.length}" aria-current="${n===i?'true':'false'}" onclick="openPhoto(${n})"></button>`).join('');const active=viewerDots.querySelector('.viewer-dot.active');if(active)active.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});}
function openPhoto(n){if(!filteredPhotos.length)return;i=n;const p=filteredPhotos[i];big.src=p.imageUrl||'';big.alt=photoTitle(p);caption.innerHTML=`<strong>${esc(photoTitle(p))}</strong><small>📁 ${esc(photoCaption(p))}</small>`;viewer.classList.add('open');viewer.setAttribute('aria-hidden','false');renderViewerDots();}
async function toggleFav(n){const p=filteredPhotos[n],s=getSession();if(!s){location.replace('index.html?autoLogin=1&loginRequired=1');return;}try{const r=await API.call('toggleFavorite',{token:s.token,photoId:p.id});if(!r.ok)throw new Error(r.message||'שגיאה');p.isFavorite=!!r.data?.favorite;const original=photos.find(x=>String(x.id)===String(p.id));if(original)original.isFavorite=p.isFavorite;renderGallery();}catch(e){toast(e.message||'לא ניתן לעדכן מועדפים','error');}}
async function deletePhoto(n){const p=filteredPhotos[n];if(!p?.canDelete)return;if(!confirm('למחוק את התמונה? התמונה תוסר מהאלבום וגם מהמועדפים.'))return;const s=getSession();if(!s)return;try{const r=await API.call('deletePhoto',{token:s.token,id:p.id});if(!r.ok)throw new Error(r.message||'שגיאה');photos=photos.filter(x=>String(x.id)!==String(p.id));filteredPhotos=filteredPhotos.filter(x=>String(x.id)!==String(p.id));renderGallery();toast('התמונה נמחקה','info');}catch(e){toast(e.message||'לא ניתן למחוק את התמונה','error');}}
function move(n){if(!filteredPhotos.length)return;i=(i+n+filteredPhotos.length)%filteredPhotos.length;openPhoto(i);}
function closeViewer(){viewer.classList.remove('open');viewer.setAttribute('aria-hidden','true');if(viewerDots)viewerDots.innerHTML='';if(slideTimer){clearInterval(slideTimer);slideTimer=null;}}
const toggleSearch=document.getElementById('toggleSearch'),photoTools=document.getElementById('photoTools');
function filterToggleMarkup(visible){return '<svg class="filter-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/><circle cx="8" cy="6" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="12" cy="18" r="1.6"/></svg><span>'+(visible?'הסתר סינון':'הצג סינון')+'</span>';}
function setSearchVisible(visible){photoTools.classList.toggle('mobile-search-hidden',!visible);toggleSearch.setAttribute('aria-expanded',String(visible));toggleSearch.setAttribute('aria-label',visible?'הסתר סינון':'הצג סינון');toggleSearch.innerHTML=filterToggleMarkup(visible);} 
toggleSearch.onclick=()=>setSearchVisible(photoTools.classList.contains('mobile-search-hidden'));
document.getElementById('x').onclick=closeViewer;document.getElementById('r').onclick=()=>move(1);document.getElementById('l').onclick=()=>move(-1);
document.addEventListener('keydown',e=>{if(!viewer.classList.contains('open'))return;if(e.key==='Escape')closeViewer();else if(e.key==='ArrowRight')move(1);else if(e.key==='ArrowLeft')move(-1);});
let viewerTouchX=null;viewer.addEventListener('touchstart',e=>{viewerTouchX=e.changedTouches?.[0]?.clientX??null;},{passive:true});viewer.addEventListener('touchend',e=>{if(viewerTouchX===null)return;const x=e.changedTouches?.[0]?.clientX??viewerTouchX,dx=x-viewerTouchX;viewerTouchX=null;if(Math.abs(dx)>45)move(dx<0?1:-1);},{passive:true});
document.getElementById('start').onclick=()=>{if(!filteredPhotos.length)return;openPhoto(0);if(slideTimer)clearInterval(slideTimer);slideTimer=setInterval(()=>{if(!viewer.classList.contains('open')){clearInterval(slideTimer);slideTimer=null;}else move(1);},2800);};
[searchTitle,searchAlbum,searchYear].forEach(el=>el.addEventListener('input',applyFilters));sortYear.addEventListener('change',applyFilters);document.getElementById('clearFilters').onclick=()=>{searchTitle.value='';searchAlbum.value='';searchYear.value='';sortYear.value='newest';applyFilters();};
init();
</script></body></html>
