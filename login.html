<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>כניסה</title><link rel="stylesheet" href="css/main.css"><script src="js/config.js"></script><script src="js/utils.js"></script>
<style id="password-toggle-eye-style">
.password-field-wrap{position:relative;display:flex;align-items:center}
.password-field-wrap input{width:100%;padding-right:48px!important}
.password-toggle-eye{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  width:34px;height:34px;border:0;background:transparent;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:currentColor;opacity:.75;
  padding:0;border-radius:8px;
}
.password-toggle-eye:hover{opacity:1;background:rgba(128,128,128,.12)}
.password-toggle-eye svg{width:21px;height:21px;pointer-events:none}
</style>


<style id="advanced-login-ui">
.login-field{position:relative}
.login-field .field-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;opacity:.72;pointer-events:none}
.login-field input{padding-left:46px!important}
.password-field-wrap .field-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;opacity:.72;pointer-events:none;z-index:2}
.password-field-wrap input{padding-left:46px!important}
.login-advanced-title{text-align:center;font-weight:700;margin-bottom:6px}
.login-advanced-subtitle{text-align:center;opacity:.72;margin-bottom:20px}
</style>
<link rel="stylesheet" href="css/session-manager.css"></head><body class="auth-page"><div class="auth-card"><div class="brand">Family <b>Album</b> ♥</div><h1>ברוכים הבאים</h1><p>התחבר לאלבום המשפחתי</p><form id="form"><div class="login-field"><svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><input id="email" type="email" placeholder="אימייל" required></div><div class="password-field-wrap"><svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input id="password" type="password" placeholder="סיסמה" required>
<button type="button" class="password-toggle-eye" aria-label="הצג סיסמה" title="הצג סיסמה" data-password-toggle="password">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/>
<circle cx="12" cy="12" r="2.8"/>
</svg>
</button></div><button class="btn">כניסה</button></form><div id="msg"></div><a href="index.html">← חזרה</a></div><script src="js/api.js"></script><script>form.onsubmit=async e=>{e.preventDefault();msg.textContent="מתחבר...";try{let r=await API.call("login",{email:email.value,password:password.value});if(!r.ok)throw Error(r.message);if(window.SessionManager?.start){ SessionManager.start(r.data.user, r.data.token, false); }location.href=(new URLSearchParams(location.search).get("return") || "dashboard.html")}catch(x){msg.textContent=x.message}}</script>
<script id="password-toggle-eye-script">
(function(){
  function eyeOpen(){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.8"/></svg>';
  }
  function eyeClosed(){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 6.2A10.7 10.7 0 0 1 12 6c6.5 0 10 6 10 6a17.4 17.4 0 0 1-3.1 3.8"/><path d="M6.2 6.8C3.6 8.6 2 12 2 12s3.5 6 10 6c1.4 0 2.7-.3 3.9-.8"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
  }
  document.addEventListener('click', function(e){
    const btn=e.target.closest('[data-password-toggle]');
    if(!btn) return;
    const id=btn.getAttribute('data-password-toggle');
    const input=document.getElementById(id);
    if(!input) return;
    const show=input.type==='password';
    input.type=show?'text':'password';
    btn.innerHTML=show?eyeClosed():eyeOpen();
    btn.setAttribute('aria-label', show?'הסתר סיסמה':'הצג סיסמה');
    btn.setAttribute('title', show?'הסתר סיסמה':'הצג סיסמה');
  });
})();
</script>

<script src="js/session-manager.js"></script><script id="session-login-helper">
window.startManagedSession=function(user,token){
  var rememberEl=document.querySelector('input[name="remember"],#rememberMe,#remember');
  var remember=!!(rememberEl && rememberEl.checked);
  if(window.SessionManager) SessionManager.start(user,token,remember);
};
</script></body></html>
